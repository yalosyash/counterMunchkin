<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3a2316" />
    <title>Манчкин — счётчик</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="stylesheet" href="css/main.css?v=responsive-art" />
    <script src="js/counters.js" defer></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <img
          class="artwork"
          src="assets/images/munchkin-hero.webp"
          width="1100"
          height="550"
          alt=""
        />
        <h1>Манчкин</h1>
      </header>
      <section class="sheet" data-stat="level" aria-labelledby="level-label">
        <img
          class="artwork"
          src="assets/images/level-sheet.webp"
          width="1100"
          height="662"
          alt=""
        />
        <h2 id="level-label">Уровень</h2>
        <div class="controls" data-counter="level">
          <button
            type="button"
            data-step="-1"
            aria-label="Убавить уровень"
            disabled
          >
            <img src="assets/icons/minus.svg" alt="" />
          </button>
          <output aria-labelledby="level-label">1</output>
          <button type="button" data-step="1" aria-label="Прибавить уровень">
            <img src="assets/icons/plus.svg" alt="" />
          </button>
        </div>
      </section>
      <section
        class="sheet"
        data-stat="strength"
        aria-labelledby="strength-label"
      >
        <img
          class="artwork"
          src="assets/images/strength-sheet.webp"
          width="1100"
          height="664"
          alt=""
        />
        <h2 id="strength-label">Сила</h2>
        <div class="controls" data-counter="strength">
          <button type="button" data-step="-1" aria-label="Убавить силу">
            <img src="assets/icons/minus.svg" alt="" />
          </button>
          <output aria-labelledby="strength-label">0</output>
          <button type="button" data-step="1" aria-label="Прибавить силу">
            <img src="assets/icons/plus.svg" alt="" />
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
